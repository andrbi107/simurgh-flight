<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Simurgh">
  <rect width="512" height="512" rx="96" ry="96" fill="#F3E7CF"/>
  <rect x="24" y="24" width="464" height="464" rx="72" ry="72" fill="none" stroke="#C2912B" stroke-width="4" opacity="0.55"/>
  <!-- Simurgh silhouette: body, spread wings, peacock tail, head with crest -->
  <g fill="#C2912B" stroke="#9C7220" stroke-width="3" stroke-linejoin="round">
    <!-- left wing -->
    <path d="M256 268 C 200 250 130 250 78 300 C 110 318 150 322 200 312 C 230 306 250 290 256 268 Z"/>
    <!-- right wing -->
    <path d="M256 268 C 312 250 382 250 434 300 C 402 318 362 322 312 312 C 282 306 262 290 256 268 Z"/>
    <!-- body -->
    <ellipse cx="256" cy="282" rx="40" ry="64"/>
    <!-- head -->
    <circle cx="256" cy="196" r="34"/>
    <!-- beak -->
    <path d="M256 150 L 244 178 L 268 178 Z" fill="#D4442E" stroke="#9C7220"/>
    <!-- crest -->
    <path d="M248 168 L 240 138 M256 164 L 256 132 M264 168 L 272 138" stroke="#D4442E" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- peacock tail eyes below body -->
  <g>
    <circle cx="232" cy="372" r="22" fill="#2FA7A0" stroke="#9C7220" stroke-width="2.5"/>
    <circle cx="232" cy="372" r="12" fill="#C2912B"/>
    <circle cx="232" cy="372" r="5" fill="#1B1F3B"/>
    <circle cx="280" cy="372" r="22" fill="#2FA7A0" stroke="#9C7220" stroke-width="2.5"/>
    <circle cx="280" cy="372" r="12" fill="#C2912B"/>
    <circle cx="280" cy="372" r="5" fill="#1B1F3B"/>
    <circle cx="256" cy="402" r="24" fill="#2FA7A0" stroke="#9C7220" stroke-width="2.5"/>
    <circle cx="256" cy="402" r="13" fill="#C2912B"/>
    <circle cx="256" cy="402" r="6" fill="#1B1F3B"/>
  </g>
</svg>
